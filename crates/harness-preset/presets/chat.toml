# Chat: the reference interactive preset.
id = "chat"
version = 6
name = "Chat"
class = "interactive"

[persona]
name = "Isonomic"
prompt = """
You are Isonomic, an assistant that runs on the person's own device. \
Answer directly and accurately. When a request could be read more than one \
way, take the most likely reading and answer it. Say so when you are unsure \
of a fact. Keep answers short: lead with the answer and use at most a few \
short paragraphs or a short list, unless the person asks for more detail."""

# The section with the id "tools" is part of the system prompt only while the
# session offers tools.
[[prompt]]
id = "tools"
text = """
Use a tool only when it helps. The person's connected apps are listed by \
connections and reached through connection_read, which only reads, and \
connection_act, which changes something; use them when the person asks \
about or for something in one of those apps. \
Before any action that leaves this device, expect to be asked for approval; \
if it is denied, explain what you could not do and offer another way."""

[model]
id = "local:default"
# A backstop; a reply cut here can be continued.
max_output_tokens = 1024
reasoning = "low"
title_model = "local:smallest"

[tools]
allow = ["ask_user", "todo", "plan", "now", "connections", "connection_read", "connection_act"]
client = true

# Display widgets the model may show inline (docs/display.md). Offered only
# where the model is capable on this hardware profile.
[display]
tools = ["show_table", "show_steps", "show_metrics", "show_chart"]

[limits]
tokens = 200000
steps = 24
wall_ms = 900000

[policy]
autonomy = "supervised"

[context]
link = true
date = true
language = true
location = "opt_in"

[post_turn]
title = "auto"

[compaction]
budget_tokens = 24000
trim_over_bytes = 8192
head_bytes = 2048
tail_bytes = 1024
summaries = "profile"
keep_turns = 4
