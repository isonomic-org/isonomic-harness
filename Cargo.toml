[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
harness-core = { path = "crates/harness-core" }
harness-testkit = { path = "crates/harness-testkit" }
harness-log = { path = "crates/harness-log" }
harness-tools = { path = "crates/harness-tools" }
harness-policy = { path = "crates/harness-policy" }
harness-preset = { path = "crates/harness-preset" }
harness-compact = { path = "crates/harness-compact" }
harness-loop = { path = "crates/harness-loop" }
harness-toolkit = { path = "crates/harness-toolkit" }
harness-host = { path = "crates/harness-host" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
